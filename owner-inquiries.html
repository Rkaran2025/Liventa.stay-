<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liventa Stay — Owner Inquiries</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f6fb;color:#202235}header{background:#fff;border-bottom:1px solid #e8e4ef;padding:14px}.top,main{max-width:1050px;margin:auto}.top{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#5d22c9,#ffb000);color:white;display:grid;place-items:center;font-weight:900}.brand b{display:block;color:#5d22c9}.brand small{color:#777;letter-spacing:2px}.wrap{padding:20px 14px}.head{display:flex;justify-content:space-between;align-items:center}.head h1{color:#4f1eaa;margin:0}.head p{color:#777;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat,.card,.tools{background:white;border:1px solid #e8e4ef;border-radius:15px;padding:14px}.stat b{font-size:25px;color:#5d22c9}.stat span{display:block;color:#777;font-size:12px;margin-top:4px}.tools{display:flex;gap:8px;margin-bottom:12px}.tools input,.tools select{padding:11px;border:1px solid #ddd8e8;border-radius:10px;background:#faf9fc}.tools input{flex:1}.list{display:grid;gap:12px}.card .row{display:flex;justify-content:space-between;gap:10px}.name{font-size:17px;font-weight:900;color:#4f1eaa}.muted{font-size:12px;color:#777;line-height:1.6}.badge{background:#eee7ff;color:#5420ae;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:900;height:max-content}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.box{background:#faf9fc;border-radius:10px;padding:9px}.box b{display:block;font-size:9px;color:#777;text-transform:uppercase;margin-bottom:4px}.box span{font-size:12px;font-weight:800}.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.btn{border:0;border-radius:9px;padding:10px 12px;font-weight:900;text-decoration:none;font-size:11px;cursor:pointer}.call{background:#eee7ff;color:#5420ae}.wa{background:#10b879;color:#fff}.status{background:#f0edf7;color:#4f1eaa}.empty{text-align:center;padding:40px;color:#777;background:white;border-radius:15px}#login{position:fixed;inset:0;background:#f7f6fb;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.login{background:white;padding:25px;border-radius:20px;width:min(390px,100%);border:1px solid #e8e4ef}.login input{width:100%;padding:13px;margin:6px 0;border:1px solid #ddd8e8;border-radius:10px}.primary{width:100%;padding:13px;border:0;border-radius:10px;background:#5d22c9;color:white;font-weight:900;margin-top:5px}.err{font-size:11px;color:#d44b62;min-height:17px}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.head{align-items:flex-start;flex-direction:column}.tools{flex-direction:column}}@media(max-width:400px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="login"><div class="login"><div class="logo">LS</div><h2>Owner Inquiries</h2><p>Private Liventa Stay panel</p><input id="email" type="email" placeholder="Owner email"><input id="password" type="password" placeholder="Password"><div id="err" class="err"></div><button class="primary" onclick="login()">Login</button></div></div>
<header><div class="top"><div class="logo">LS</div><div class="brand"><b>LIVENTA</b><small>STAY • OWNER</small></div><div style="flex:1"></div><button class="btn status" onclick="logout()">Logout</button></div></header>
<main class="wrap"><div class="head"><div><h1>Inquiry Details</h1><p>Visitor enquiries & visit requests</p></div><button class="btn status" onclick="load()">↻ Refresh</button></div>
<div class="stats"><div class="stat"><b id="n">0</b><span>New</span></div><div class="stat"><b id="c">0</b><span>Contacted</span></div><div class="stat"><b id="v">0</b><span>Visit</span></div><div class="stat"><b id="x">0</b><span>Converted</span></div></div>
<div class="tools"><input id="q" placeholder="Search name, phone, PG, college..."><select id="f"><option value="">All status</option><option>new</option><option>contacted</option><option>visit</option><option>converted</option><option>closed</option></select></div><div id="list" class="list"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const sb=supabase.createClient("https://oeueypvpswugaqtodzbd.supabase.co","sb_publishable_YEQy-1N5TIok2GB9xi-tSA_U0jtZYvL");let rows=[];
async function login(){err.textContent='';let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){err.textContent=r.error.message;return}document.getElementById('login').style.display='none';load()}
async function logout(){await sb.auth.signOut();document.getElementById('login').style.display='flex'}
async function init(){let r=await sb.auth.getUser();if(r.data.user){document.getElementById('login').style.display='none';load()}}
async function load(){let r=await sb.from('visit_requests').select('*').order('created_at',{ascending:false});if(r.error){list.innerHTML='<div class="empty">Could not load inquiries. Check Supabase table/RLS permissions.</div>';return}rows=r.data||[];render()}
function render(){let s=q.value.toLowerCase(),st=f.value,a=rows.filter(z=>(!s||[z.full_name,z.phone,z.property_name,z.notes,z.email,z.college].join(' ').toLowerCase().includes(s))&&(!st||z.status===st));n.textContent=rows.filter(z=>z.status==='new').length;c.textContent=rows.filter(z=>z.status==='contacted').length;v.textContent=rows.filter(z=>z.status==='visit').length;x.textContent=rows.filter(z=>z.status==='converted').length;list.innerHTML=a.length?a.map(z=>{let p=String(z.phone||'').replace(/\D/g,'');let w=p?'https://wa.me/91'+p+'?text='+encodeURIComponent('Hi '+(z.full_name||'')+', regarding your Liventa Stay enquiry.'):'#';return '<div class="card"><div class="row"><div><div class="name">'+e(z.full_name||'Visitor')+'</div><div class="muted">🏠 '+e(z.property_name||'PG / Student Stay')+'<br>🕒 '+e(z.created_at||'')+'</div></div><span class="badge">'+e(z.status||'new')+'</span></div><div class="grid"><div class="box"><b>Contact</b><span>'+e(z.phone||'—')+'</span></div><div class="box"><b>Visit Date</b><span>'+e(z.visit_date||'—')+'</span></div><div class="box"><b>Time</b><span>'+e(z.time_slot||'—')+'</span></div><div class="box"><b>Visitors</b><span>'+e(z.visitors||'—')+'</span></div><div class="box"><b>College</b><span>'+e(z.college||'—')+'</span></div><div class="box"><b>Email</b><span>'+e(z.email||'—')+'</span></div></div>'+(z.notes?'<div class="muted" style="margin-top:10px;background:#fffaf0;padding:10px;border-radius:10px">💬 '+e(z.notes)+'</div>':'')+'<div class="actions">'+(p?'<a class="btn call" href="tel:+91'+p+'">📞 Call</a><a class="btn wa" target="_blank" href="'+w+'">◉ WhatsApp</a>':'')+'<select class="btn status" onchange="change(\''+e(z.id)+'\',this.value)"><option value="">Change status</option>'+['new','contacted','visit','converted','closed'].map(k=>'<option value="'+k+'" '+(k===z.status?'selected':'')+'>'+k+'</option>').join('')+'</select></div></div>'}).join(''):'<div class="empty">No inquiries found.</div>'}
async function change(id,status){if(!status)return;let r=await sb.from('visit_requests').update({status}).eq('id',id);if(r.error)alert(r.error.message);else load()}
function e(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
q.oninput=render;f.onchange=render;init();
</script></body></html>
