<script>
function openReview(){document.getElementById('reviewModal')?.classList.add('show')}
function closeReview(){document.getElementById('reviewModal')?.classList.remove('show')}
function submitReview(){const n=document.getElementById('reviewName').value.trim(),r=document.getElementById('reviewRating').value,t=document.getElementById('reviewText').value.trim();if(!n||!t){alert('Please enter your name and review.');return}window.open('https://wa.me/917454024119?text='+encodeURIComponent('Hi Liventa Stay, I want to submit a review.\nName: '+n+'\nRating: '+r+'/5\nReview: '+t),'_blank');closeReview()}
</script>
<script>
let currentPropertyForVisit='';
async function scheduleVisit(){
  currentPropertyForVisit=(window.__currentPropertyName||'')+' in '+(window.__currentPropertyLocation||'');
  const {data}=await sb.auth.getSession();
  if(!data?.session){document.getElementById('loginModal')?.classList.add('show');return;}
  const msg='Hi Liventa Stay, I want to schedule a visit for '+currentPropertyForVisit+'. Please share available time slots.';
  window.open(wa(msg),'_blank');
}
function closeLogin(){document.getElementById('loginModal')?.classList.remove('show')}
async function propertyLogin(){
  const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;
  const m=document.getElementById('loginMsg'); if(!email||password.length<6){m.textContent='Enter a valid email and password (6+ characters).';return;}
  m.textContent='Logging in…';
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){m.textContent=error.message;return;}
  closeLogin(); scheduleVisit();
}
async function propertySignup(){
  const email=document.getElementById('loginEmail').value.trim(),password=document.getElementById('loginPassword').value;
  const m=document.getElementById('loginMsg'); if(!email||password.length<6){m.textContent='Enter a valid email and password (6+ characters).';return;}
  m.textContent='Creating account…';
  const {data,error}=await sb.auth.signUp({email,password});
  if(error){m.textContent=error.message;return;}
  if(data?.session){closeLogin();scheduleVisit();} else {m.textContent='Account created. Check your email if confirmation is enabled, then login.';}
}
async function loadSimilarStays(currentId,currentType,currentLoc){
  const box=document.getElementById('similarGrid'); if(!box)return;
  const {data,error}=await sb.from('properties').select('id,name,location,locality,rent,monthly_rent,price,image_url,media_urls,gender,property_type').neq('id',currentId).limit(12);
  if(error||!data?.length){box.innerHTML='';return;}
  const loc=String(currentLoc||'').toLowerCase();
  const rows=data.filter(x=>String(x.location||x.locality||'').toLowerCase().includes(loc.split(',')[0].trim())).slice(0,3);
  const use=(rows.length?rows:data).slice(0,3);
  box.innerHTML=use.map(x=>{const media=Array.isArray(x.media_urls)&&x.media_urls.length?x.media_urls[0]:x.image_url||'https://images.unsplash.com/photo-1522708323590-d24dbb6b0267?auto=format&fit=crop&w=700&q=80';const rent=Number(x.rent??x.monthly_rent??x.price??0);return '<a class="sim" href="property.html?id='+encodeURIComponent(x.id)+'" style="text-decoration:none"><img src="'+esc(media)+'" alt="'+esc(x.name||'Property')+'"><div><b>'+esc(x.name||'Stay')+'</b><span>'+(rent?'₹'+rent.toLocaleString('en-IN')+' /month':'Rent on enquiry')+' · '+esc(x.location||x.locality||'Delhi')+'</span></div></a>'}).join('');
}
</script>
